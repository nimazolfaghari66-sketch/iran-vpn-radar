name: radar-cycle

# Runs the Iran VPN Radar update cycle every 2 hours.
#
# IMPORTANT — Iranian testing:
# This workflow runs on GitHub-hosted runners, which are NOT inside Iran. It can
# therefore discover, normalise, de-duplicate, generate and validate
# subscriptions, and it performs real *global* tunnel verification (sing-box) to
# build the candidate pool. It CANNOT produce Iran-verified results. Unless an
# Iran based probe is configured (IRAN_PROBE_URL + IRAN_PROBE_TOKEN secrets),
# every configuration stays PENDING_IRAN_TEST and the Iran-verified subscription
# files remain empty by design. Never configure a foreign host as the "Iran probe".

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours, on the hour
  workflow_dispatch:
    inputs:
      no_publish:
        description: "Skip GitHub publishing (dry run)"
        type: boolean
        default: false

concurrency:
  group: radar-cycle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Real tunnel verification needs an actual protocol client. This is NOT
      # an Iranian test: it runs on the GitHub runner (outside Iran) and only
      # feeds the clearly-separated candidate pool. Never labelled as Iranian.
      - name: Install VPN client (sing-box)
        run: python scripts/install_client.py --dir .bin

      # Internal state (config history, failure counts, source registry) is kept
      # out of the public repo, so it is persisted via the Actions cache instead.
      # This is what lets the consecutive-failure policy work across cycles.
      - name: Restore radar state
        uses: actions/cache@v4
        with:
          path: data
          key: radar-state-${{ github.run_id }}
          restore-keys: |
            radar-state-

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Scan for secrets
        run: python scripts/scan_secrets.py --allow-private-ips

      - name: Run update cycle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IRAN_RADAR_PROBE_MODE: ${{ vars.IRAN_RADAR_PROBE_MODE || 'unavailable' }}
          IRAN_PROBE_URL: ${{ secrets.IRAN_PROBE_URL }}
          IRAN_PROBE_TOKEN: ${{ secrets.IRAN_PROBE_TOKEN }}
          # Iranian Check-Host diagnostics: reachability from inside Iran only.
          # These results are never publishable (see docs/CHECKHOST.md).
          IRAN_RADAR_CHECKHOST: ${{ vars.IRAN_RADAR_CHECKHOST || '1' }}
          IRAN_RADAR_CHECKHOST_BATCH: ${{ vars.IRAN_RADAR_CHECKHOST_BATCH || '12' }}
          IRAN_RADAR_CHECKHOST_CHECKS: ${{ vars.IRAN_RADAR_CHECKHOST_CHECKS || 'dns,tcp' }}
          # Iranian Globalping diagnostics: real HTTP/TLS observations from
          # probes on Iranian ISP networks. Reachability only, never publishable
          # (see docs/GLOBALPING.md).
          IRAN_RADAR_GLOBALPING: ${{ vars.IRAN_RADAR_GLOBALPING || '1' }}
          IRAN_RADAR_GLOBALPING_BATCH: ${{ vars.IRAN_RADAR_GLOBALPING_BATCH || '40' }}
          IRAN_RADAR_GLOBALPING_LIMIT: ${{ vars.IRAN_RADAR_GLOBALPING_LIMIT || '2' }}
          # Global real-tunnel verification (NOT Iranian). Runs sing-box on the
          # runner and publishes passing configs to the candidate pool only.
          IRAN_RADAR_TUNNEL_VERIFY: ${{ vars.IRAN_RADAR_TUNNEL_VERIFY || '1' }}
          IRAN_RADAR_TUNNEL_BATCH: ${{ vars.IRAN_RADAR_TUNNEL_BATCH || '800' }}
          IRAN_RADAR_TUNNEL_WORKERS: ${{ vars.IRAN_RADAR_TUNNEL_WORKERS || '16' }}
        run: |
          if [ "${{ github.event.inputs.no_publish }}" = "true" ]; then
            python scripts/run_cycle.py --no-publish
          else
            python scripts/run_cycle.py
          fi

      - name: Upload cycle artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-status
          path: |
            status/
            data/summary.internal.json
          if-no-files-found: ignore
          retention-days: 7
